# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name _;

    # SSL certs (mount these inside the container)
    ssl_certificate /etc/ssl/certs/wb-impact-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/wb-impact-dashboard.key;

    # Security and protocol settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Root directory of your React app
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: redirect all non-file paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve static assets efficiently
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Optional: enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
