# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name _;

    # Root folder for your React/Vite build
    root /usr/share/nginx/html;
    index index.html;

    # SSL configuration
    ssl_certificate     /etc/ssl/certs/wb-impact-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/wb-impact-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------- Serve Frontend ----------
    location / {
        try_files $uri /index.html;
    }

    # ---------- Auth Service ----------
    # Since Spring Boot uses context-path=/api,
    # /api/auth/... → http://auth-service:8081/api/auth/...
    location /api/auth/ {
        proxy_pass http://auth-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------- Dashboard Service ----------
    # /api/dashboard/... → http://dashboard-service:8082/api/dashboard/...
    location /api/dashboard/ {
        proxy_pass http://dashboard-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
