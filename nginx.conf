# ------------------------- HTTP → HTTPS Redirect -------------------------
server {
    listen 80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------- HTTPS Server -------------------------
server {
    listen 443 ssl;
    server_name _;

    # Root folder for your React/Vite build
    root /usr/share/nginx/html;
    index index.html;

    # SSL configuration
    ssl_certificate     /etc/ssl/certs/wb-impact-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/wb-impact-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ------------------------- Frontend -------------------------
    location / {
        try_files $uri /index.html;
    }

    # ------------------------- Auth Service -------------------------
    # Forward /api/auth/... to auth-service
    location /api/auth/ {
        proxy_pass http://auth-service:8081;   # keep full path
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ------------------------- Dashboard Service -------------------------
    # Forward /api/dashboard/... to dashboard-service
    location /api/dashboard/ {
        proxy_pass http://dashboard-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ------------------------- Performance -------------------------
    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
