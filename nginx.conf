# ---------- HTTP: Redirect all traffic to HTTPS ----------
server {
    listen 80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# ---------- HTTPS: Serve Vite app ----------
server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificates (already copied into the image)
    ssl_certificate     /etc/ssl/certs/wb-impact-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/wb-impact-dashboard.key;

    # SSL best practices
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve static files
    location / {
        try_files $uri /index.html;
    }

    # Optional: Enable gzip for faster loading
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
